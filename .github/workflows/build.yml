name: Build Flutter APK

on:
  push:
    branches:
      - main

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --org com.geetesh.gkirayaplus --project-name g_kiraya_plus .
          fi

      - name: Sync main.dart Code
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then
            mv main.dart lib/main.dart
          elif [ -f lib/lib/main.dart ]; then
            mv lib/lib/main.dart lib/main.dart
            rm -rf lib/lib
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter
