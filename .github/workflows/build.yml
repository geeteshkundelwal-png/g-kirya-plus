                  padding: EdgeInsets.all(16),
                  children: [
                    TextField(
                      decoration: InputDecoration(
                        hintText: 'शहर या कोचिंग एरिया खोजें...',
                        prefixIcon: Icon(Icons.search, color: Colors.teal),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: Colors.white,
                      ),
                    ),
                    SizedBox(height: 15),
                    Text('सत्यापित बजट कमरे:', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    SizedBox(height: 10),
                    Card(
                      elevation: 3,
                      child: ListTile(
                        leading: Icon(Icons.home, color: Colors.teal, size: 35),
                        title: Text('Premium 1 BHK - सेक्टर 16, फरीदाबाद', style: TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: Text('किराया: ₹ 6,500/महीना\nउपहार: इस कमरे को बुक करने पर ₹500 का रेंट कैशबैक सीधे UPI में!'),
                        trailing: Icon(Icons.arrow_forward_ios, size: 14),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class ShiftingClubView extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('ਫਰੀ सामान शिफ्टिंग network 1 🚛', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)), backgroundColor: Colors.teal.shade800),
                body: ListView(
                  padding: EdgeInsets.all(16),
                  children: [
                    Card(
                      color: Colors.blue.shade50,
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
