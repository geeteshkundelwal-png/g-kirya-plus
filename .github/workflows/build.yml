name: Setup Project and Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          rm -rf * .github
          flutter create --org com.geetesh.gkirayaplus --project-name g_kiraya_plus .
          mkdir -p .github/workflows

      - name: Write App Code to main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(GKirayaPlusApp());

          class GKirayaPlusApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'G-Kiraya Plus',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  useMaterial3: true,
                  scaffoldBackgroundColor: Color(0xFFF8FAFC),
                ),
                home: MainNavigationPage(),
              );
            }
          }

          class MainNavigationPage extends StatefulWidget {
            @override
            _MainNavigationPageState createState() => _MainNavigationPageState();
          }

          class _MainNavigationPageState extends State<MainNavigationPage> {
            int _currentIndex = 0;
            
            final List<Widget> _screens = [
              TenantView(),
              OwnerFormView(),
              TutorView(),
              AdminDashboardView()
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _screens[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  selectedItemColor: Colors.teal,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  onTap: (index) => setState(() => _currentIndex = index),
                  items: [
                    BottomNavigationBarItem(icon: Icon(Icons.search), label: 'खोजें (Search)'),
                    BottomNavigationBarItem(icon: Icon(Icons.add_box), label: 'कमरा जोड़ें (Add Room)'),
                    BottomNavigationBarItem(icon: Icon(Icons.book), label: 'किरायेदार का विवरण'),
                    BottomNavigationBarItem(icon: Icon(Icons.admin_panel_settings), label: 'एडमिन पैनल'),
                  ],
                ),
              );
            }
          }

          class TenantView extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('G-Kiraya Plus', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 20, color: Colors.white)),
                      Text('An App by Geetesh', style: TextStyle(fontSize: 11, color: Colors.white70)),
                    ],
                  ),
                  backgroundColor: Colors.teal,
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(20.0),
                    child: Text(
                      'किरायेदार यहाँ कमरे खोज सकते हैं और विवरण देख सकते हैं।',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 16, color: Colors.black87),
                    ),
                  ),
                ),
              );
            }
          }

          class OwnerFormView extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('मकान मालिक का फॉर्म', style: TextStyle(color: Colors.white)), 
                  backgroundColor: Colors.teal
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(20.0),
                    child: Text(
                      'मकान मालिक यहाँ अपना विवरण and Aadhaar KYC भर सकते हैं।',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 16),
                    ),
                  ),
                ),
              );
            }
          }

          class TutorView extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('ट्यूटर और कोचिंग का विवरण', style: TextStyle(color: Colors.white)), 
                  backgroundColor: Colors.teal
                ),
                body: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(20.0),
                    child: Text(
                      'आसपास के ट्यूटर्स और कोचिंग सेंटर्स की जानकारी यहाँ मिलेगी।',
                      textAlign: TextAlign.center,
                      style: TextStyle(fontSize: 16),
                    ),
                  ),
                ),
              );
            }
          }

          class AdminDashboardView extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('एडमिन डैशबोर्ड (Geetesh)', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  backgroundColor: Colors.redAccent,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('यह ऐप का एडमिन कंट्रोल पैनल है', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      SizedBox(height: 20),
                      Card(
                        color: Colors.green.shade50,
                        child: ListTile(
                          leading: Icon(Icons.monetization_on, color: Colors.green, size: 40),
                          title: Text('कुल कमाई (Revenue)'),
                          subtitle: Text('₹ 0.00 (विज्ञापन और सब्सक्रिप्शन से होने वाली कमाई)'),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Download Link
        uses: actions/upload-artifact@v4
        with:
          name: g-kiraya-plus-app
          path: build/app/outputs/flutter-apk/app-release.apk
